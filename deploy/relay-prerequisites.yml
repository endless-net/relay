---
- name: Prepare Relay hosts
  hosts: relays
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: Validate the approved Relay host platform
      ansible.builtin.assert:
        that:
          - ansible_connection == 'ssh'
          - relay_component == 'relay'
          - ansible_facts.system == 'Linux'
          - ansible_facts.os_family == 'Debian'
          - relay_public_name is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')

    - name: Install public Relay TLS tooling
      ansible.builtin.apt:
        name:
          - certbot
          - openssl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Verify Certbot installation
      ansible.builtin.command:
        argv: [certbot, --version]
      changed_when: false

    - name: Verify OpenSSL installation
      ansible.builtin.command:
        argv: [openssl, version]
      changed_when: false
