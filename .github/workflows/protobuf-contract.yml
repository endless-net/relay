name: Protobuf contract checks (advisory)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**/*.proto"
      - "buf.yaml"
      - "buf.lock"
      - "buf.gen.yaml"
      - "contracts/proto-baseline/**"
      - ".github/workflows/protobuf-contract.yml"
  push:
    branches: [main]
    paths:
      - "api/**/*.proto"
      - "buf.yaml"
      - "buf.lock"
      - "buf.gen.yaml"
      - "contracts/proto-baseline/**"
      - ".github/workflows/protobuf-contract.yml"

permissions:
  contents: read

jobs:
  protobuf:
    name: Buf validation (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.72.0
          setup_only: true
      - name: Validate protobuf contract
        shell: bash
        run: |
          set -o pipefail
          report=protobuf-contract-report.txt
          result=PASS
          if ! buf lint 2>&1 | tee "$report"; then
            result=FAIL
          fi
          if ! buf build 2>&1 | tee -a "$report"; then
            result=FAIL
          fi

          baseline="$(find contracts/proto-baseline -type f -name '*.binpb' -print -quit)"
          if [ -n "$baseline" ]; then
            if ! buf breaking api --against "$baseline" 2>&1 | tee -a "$report"; then
              result=FAIL
            fi
          else
            printf 'SKIPPED: no released protobuf baseline exists yet.\n' | tee -a "$report"
          fi

          if [ "$result" = PASS ]; then
            echo "::notice title=Protobuf contract::PASS"
          else
            echo "::warning title=Protobuf contract::FAIL (advisory); see artifact"
          fi
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: protobuf-contract-report
          path: protobuf-contract-report.txt
          if-no-files-found: error
          retention-days: 14
