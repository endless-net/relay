name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        type: boolean
        default: false
        description: Run the 30-minute product soak
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3
        with:
          version: 1.72.0
          setup_only: true
      - name: Verify generated protobuf
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          buf lint
          buf build
          buf generate
          git diff --exit-code -- api/relay/v1
      - name: Verify modules
        run: go mod verify
      - name: Verify dependency licenses
        run: ./scripts/check-licenses.sh
      - run: sh scripts/verify.sh
      - name: Lint deployment scripts
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d scripts/*.sh
      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: 1.27.0
          go-package: ./...
          cache: false
      - name: Verify generated state is clean
        run: git diff --exit-code

  product-e2e:
    uses: ./.github/workflows/product-e2e.yml
    with:
      extended: ${{ inputs.extended == true }}

  verify:
    if: always()
    needs: [checks, product-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every product verification group
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.product-e2e.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$E2E_RESULT" = success
