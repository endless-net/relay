name: Go CI and release
on:
  push:
    branches: ['main']
    tags: ['v0.*', 'api/v0.*']
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_type == 'branch' && github.sha || 'release' }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GOPRIVATE: github.com/endless-net/*
      GH_TOKEN: ${{ secrets.PRODUCER_API_READ_TOKEN }}
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ''
      GIT_CONFIG_KEY_1: credential.helper
      GIT_CONFIG_VALUE_1: '!gh auth git-credential'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit passed its required CI on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          workflow=ci.yml
          if [[ "$GITHUB_REF_NAME" == api/* ]]; then workflow=api-ci.yml; fi
          checked_sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
            --branch main --event push --commit "$GITHUB_SHA" --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""')
          test "$checked_sha" = "$GITHUB_SHA"
      - name: Verify baseline
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Require protected read-only producer API access
        if: ${{ !startsWith(github.ref, 'refs/tags/api/') }}
        run: |
          test -n "$GH_TOKEN" || { echo 'PRODUCER_API_READ_TOKEN is required; release and Go CI require this token' >&2; exit 1; }
      - name: Install pinned Go check tools
        if: github.ref == 'refs/heads/main'
        run: bash scripts/install-ci-tools.sh --go-only
      - name: Go tests, vulnerability scan and lint
        if: github.ref == 'refs/heads/main'
        run: go run ./scripts/ci check --go-only
      - name: Build declared release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: go run ./scripts/ci build --tag "$TAG"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: relay-release-${{ github.sha }}
          path: .artifacts
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
  release:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: relay-release-${{ github.sha }}
          path: .artifacts
      - name: Publish exact checked tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: go run ./scripts/ci publish --tag "$TAG" --sha "$SOURCE_SHA"
