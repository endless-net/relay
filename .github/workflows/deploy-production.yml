name: Deploy production

"on":
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA from main to deploy
        required: true
        type: string
      target:
        description: Inventory target to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - coordinator
          - small-msk
          - spb
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      target:
        required: false
        default: all
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: endlessnet-relay-production
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify commit provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REVISION: ${{ inputs.revision }}
          DEPLOY_WORKFLOW_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          args=(--revision "$DEPLOY_REVISION")
          if [[ -n "$DEPLOY_WORKFLOW_REF" ]]; then
            args+=(--workflow-ref "$DEPLOY_WORKFLOW_REF")
          fi
          ./scripts/verify-production-provenance.sh "${args[@]}"
          sh scripts/verify.sh

      - name: Build immutable commit artifact
        env:
          RELAY_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELAY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELAY_REVISION"
          package_name="endlessnet-relay_${RELAY_REVISION}_linux_amd64"
          package_root="$RUNNER_TEMP/$package_name"
          install -d "$package_root/examples"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o "$package_root/endlessnet-relay" ./cmd/endlessnet-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o "$package_root/endlessnet-relay-coordinator" \
            ./cmd/endlessnet-relay-coordinator
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o "$package_root/endlessnet-relay-smoke" \
            ./cmd/endlessnet-relay-smoke
          install -m 0644 \
            deploy/endlessnet-relay.service \
            deploy/endlessnet-relay-coordinator.service \
            deploy/endlessnet-relay-cert-renew.service \
            deploy/endlessnet-relay-cert-renew.timer \
            deploy/renew-relay-certificate.sh \
            deploy/reload-relay-certificate.sh \
            deploy/prepare-relay-certificate-renewal.sh \
            deploy/restore-relay-certificate-renewal.sh \
            "$package_root/"
          install -m 0644 \
            deploy/coordinator.env.example \
            deploy/relay.env.example \
            deploy/relay-instance.env.example \
            deploy/endpoints.example.json \
            "$package_root/examples/"
          install -m 0644 docs/systemd-deployment.md \
            "$package_root/SYSTEMD-DEPLOYMENT.ru.md"
          install -m 0644 LICENSE NOTICE THIRD_PARTY_NOTICES "$package_root/"
          {
            printf 'version=%s\n' "$RELAY_REVISION"
            printf 'commit=%s\n' "$RELAY_REVISION"
            printf 'target=linux/amd64\n'
            printf 'builder=%s\n' "$(go version)"
          } > "$package_root/BUILD-INFO"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/$package_name.tar.gz" "$package_name"
          (
            cd dist
            sha256sum "$package_name.tar.gz" > checksums.txt
            sha256sum -c checksums.txt
          )

      - name: Upload immutable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: endlessnet-relay-${{ inputs.revision }}
          path: |
            dist/endlessnet-relay_${{ inputs.revision }}_linux_amd64.tar.gz
            dist/checksums.txt
            deploy/relay.yml
            deploy/relay-prerequisites.yml
            scripts/setup-production-ansible.sh
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Request infrastructure deployment
    needs: build
    uses: endless-net/infrastructure/.github/workflows/deploy-service.yml@main
    with:
      service: relay
      commit_sha: ${{ inputs.revision }}
      artifact_name: endlessnet-relay-${{ inputs.revision }}
      target: ${{ inputs.target }}
