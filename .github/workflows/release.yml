name: Release

on:
  push:
    tags: ["v*"]

env:
  RELEASE_TAG: ${{ github.ref_name }}

permissions:
  contents: write
  packages: write
  pull-requests: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate version and source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ./scripts/verify-production-provenance.sh --version "$RELEASE_TAG"
          sh scripts/verify.sh
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts
        shell: bash
        run: bash scripts/build-release.sh "$RELEASE_TAG" dist
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable image tags
        id: tags
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          major=${version%%.*}
          remainder=${version#*.}
          minor=${remainder%%.*}
          {
            echo "relay<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}-public:${RELEASE_TAG}"
            echo "ghcr.io/${GITHUB_REPOSITORY}-public:${major}.${minor}"
            echo "ghcr.io/${GITHUB_REPOSITORY}-public:${major}"
            echo "EOF"
            echo "coordinator<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}-coordinator-public:${RELEASE_TAG}"
            echo "ghcr.io/${GITHUB_REPOSITORY}-coordinator-public:${major}.${minor}"
            echo "ghcr.io/${GITHUB_REPOSITORY}-coordinator-public:${major}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.relay }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            COMMIT=${{ github.sha }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.coordinator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.coordinator }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/source-sbom.spdx.json
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        if: ${{ github.event.repository.visibility == 'public' }}
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true

  deploy-production:
    if: ${{ vars.RELAY_AUTO_DEPLOY_AFTER_RELEASE == 'true' }}
    needs: release
    uses: ./.github/workflows/deploy-production.yml
    with:
      revision: ${{ needs.release.outputs.commit_sha }}
