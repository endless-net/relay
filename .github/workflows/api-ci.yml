name: API build verification
on:
  push:
    branches: ['main']
    paths:
      - 'api/**'
      - '.ci/profile.json'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/ci.yml'
      - 'scripts/check-api-build.sh'
      - 'scripts/ci/**'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Set up pinned generators
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          go install golang.org/x/tools/cmd/goimports@v0.48.0
      - name: Verify API build against contract
        run: bash scripts/check-api-build.sh
