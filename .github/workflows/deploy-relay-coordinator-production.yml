name: Deploy Relay Coordinator production

"on":
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA from main to deploy
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-production.yml
    with:
      revision: ${{ inputs.revision }}
      target: coordinator
